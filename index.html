    <title>3D Laycard Universitas Bina Darma - Bagaskara Amukti Palapa</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#0b0f17;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="width:48px;height:48px;border:3px solid rgba(255,255,255,0.1);border-top:3px solid #0b3b82;border-radius:50%;animation:ubd-spin 1s linear infinite;margin-bottom:16px;"></div>
        <p style="font-size:14px;letter-spacing:2px;font-weight:600;color:#f8fafc;">UNIVERSITAS BINA DARMA</p>
        <p style="font-size:12px;color:#64748b;margin-top:6px;letter-spacing:1px;">Memuat 3D Laycard...</p>
        <style>@keyframes ubd-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
